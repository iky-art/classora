# Aktifkan: a2enmod rewrite headers proxy_fcgi ssl
<VirtualHost *:443>
    ServerName classora.example.sch.id
    DocumentRoot /var/www/classora/apps/web/dist

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/classora.example.sch.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/classora.example.sch.id/privkey.pem

    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY

    <Directory /var/www/classora/apps/web/dist>
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/(api|sanctum)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /index.html [L]
    </Directory>

    Alias /api /var/www/classora/apps/api/public
    Alias /sanctum /var/www/classora/apps/api/public
    <Directory /var/www/classora/apps/api/public>
        Require all granted
        FallbackResource /index.php
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
