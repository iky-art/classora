# /etc/nginx/sites-available/classora.conf — sesuaikan domain, path, dan versi PHP-FPM.
server {
    listen 80;
    server_name classora.example.sch.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name classora.example.sch.id;

    ssl_certificate     /etc/letsencrypt/live/classora.example.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classora.example.sch.id/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA
    root /var/www/classora/apps/web/dist;
    index index.html;
    location / { try_files $uri /index.html; }

    # API Laravel
    location ~ ^/(api|sanctum) {
        root /var/www/classora/apps/api/public;
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        root /var/www/classora/apps/api/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ~ /\.(?!well-known) { deny all; }
}
